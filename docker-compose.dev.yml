# ParkSpot — sama infrastruktura (Postgres + MinIO), bez aplikacji.
# Do lokalnego developmentu: kontenery trzymają dane, aplikację uruchamiasz
# na hoście przez `npm run dev` (hot reload).
#
#   docker compose -f docker-compose.dev.yml up -d
#   docker compose -f docker-compose.dev.yml down        # zatrzymuje, dane zostają
#   docker compose -f docker-compose.dev.yml down -v     # kasuje też dane
#
# Wolumeny są te same co w docker-compose.yml (nazwane), więc obie ścieżki
# widzą tę samą bazę.
#
# DATABASE_URL dla tej ścieżki:
#   postgresql://parkspot:parkspot@localhost:5432/parkspot

services:
  db:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_USER: parkspot
      POSTGRES_PASSWORD: parkspot
      POSTGRES_DB: parkspot
    ports:
      - "5432:5432"
    volumes:
      - parkspot-db-data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U parkspot -d parkspot"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  minio:
    image: minio/minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: parkspot
      MINIO_ROOT_PASSWORD: parkspot-dev-secret
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - parkspot-minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  minio-init:
    image: minio/mc
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 parkspot parkspot-dev-secret &&
      mc mb --ignore-existing local/parkspot-dev &&
      mc anonymous set download local/parkspot-dev
      "
    restart: "no"

volumes:
  parkspot-db-data:
    name: parkspot-db-data
  parkspot-minio-data:
    name: parkspot-minio-data
